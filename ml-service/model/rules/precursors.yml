# Precursor lexicons (EEI SCL concepts: energy source + barrier status) used by
# model/precursor_extract.py. Regex, case-insensitive. Group 1 of each pattern is
# the canonical surface form recorded.
energy_sources:
  - "(stored\\s+)?(pressure|pressurized\\s+(gas|steam|air))"
  - "\\bsteam\\b"
  - "\\bhydrocarbon|crude|condensate|naphtha|gas\\s+oil\\b"
  - "\\bh2s|h₂s|hydrogen\\s+sulphide\\b"
  - "\\bchemical\\s*(spill|exposure|release)?"
  - "\\belectric(al|ity)?\\b.*\\b(shock|exposed|live|cable)\\b"
  - "\\blive\\s+(cable|panel|equipment|wire)\\b"
  - "\\bthermal|heat\\s+source|furnace|boiler\\b"
  - "\\bcryogenic|ln2|liquid\\s+nitrogen\\b"
  - "\\bkinetic|rotating\\s+(equipment|shaft|machinery)|moving\\s+(part|belt)\\b"
  - "\\bgravit(y|ational)|falling\\s+(object|item|piece)\\b"
  - "\\bradiation|radiograph\\w*\\b"
  - "\\bfire|flame|spark\\b"

barrier_failures:
  - "\\b(not|never|without|no)\\s+(wearing|using|provided|installed|fitted|done|taken|obtained)\\b[^.;]{0,40}"
  - "\\b(missing|absent|defective|faulty|broken|damaged|expired|inoperat\\w+)\\b[^.;]{0,40}"
  - "\\b(bypassed|defeated|removed|disconnected|disabled|jettisoned)\\b[^.;]{0,40}"
  - "\\bfailed\\s+(to|the|system|brake|harness|sling|rope)\\b[^.;]{0,30}"
  - "\\b(not\\s+closed|left\\s+open|unsecured|unguarded|unlocked)\\b"
  - "\\bbarrier\\s+(gap|failure|missing|absent)\\b"
  - "\\bsafeguard\\s+(absent|missing|failed|defeated)\\b"

activities:
  - "\\bweld\\w*\\b"
  - "\\bgrinding\\b"
  - "\\bcutting\\b"
  - "\\b(hoist|lift)(ing|ed)?\\b"
  - "\\bcrane\\s+operation\\b"
  - "\\brigging\\b"
  - "\\bscaffold(ing|ing\\s+erection|\\s+erection)?\\b"
  - "\\b(vessel|tank|confined\\s+space)\\s+entry\\b"
  - "\\bmaintenance\\b"
  - "\\brepair(ing)?\\b"
  - "\\binspection\\b"
  - "\\bdriving\\b|\\bvehicle\\s+movement\\b"
  - "\\bloading|unloading\\b"
  - "\\bflush(ing)?\\b|\\bpurg(ing)?\\b"
  - "\\bhydro\\s?test|pressure\\s+test\\b"
  - "\\bline\\s?break\\w*\\b"
  - "\\bblinding|deblinding\\b"
  - "\\bgauging\\b|\\bsampling\\b"
  - "\\bpainting\\b|\\bsandblast\\w*\\b"
  - "\\bexcavat(ing|ion)\\b"
  - "\\bde[- ]?bottling\\b"
  - "\\brefuel\\w*\\b|\\bfueling\\b|\\bfuelling\\b"
  - "\\btransfer(ring)?\\s+(of|product|fuel|crude)\\b"
  - "\\bcleaning\\b"
  - "\\bhot\\s+tapping\\b"

locations:
  - "\\btank\\s?\\w*\\b"
  - "\\bvessel\\b"
  - "\\bcolumn\\b|\\breactor\\b|\\boven\\b|\\bfurnace\\b|\\bboiler\\b"
  - "\\bpipeline|pipe\\s?line\\b"
  - "\\bwell\\s?(site|pad|bore)\\b"
  - "\\bplatform\\b|\\brig\\b"
  - "\\bcompressor\\s+(station|house|building)\\b"
  - "\\bterminal\\b|\\bdepot\\b|\\brefinery\\b|\\bgas\\s+plant\\b"
  - "\\bloading\\s+(point|rack)\\b"
  - "\\bworkshop\\b|\\bwarehouse\\b|\\blaydown\\s+area\\b"
  - "\\btrench\\b|\\bpit\\b|\\bsump\\b|\\bmanhole\\b"
  - "\\bcontrol\\s+room\\b"
  - "\\blease\\s+road\\b|\\bhighway\\b|\\binternal\\s+road\\b"
  - "\\bscaffold\\b"
  - "\\bflare\\s?(stack|tip|line)?\\b"
